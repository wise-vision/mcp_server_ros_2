name: WiseVision MCP Server Tests

on:
  pull_request:
    branches:
      - dev
      - main
      - 'stabilization/**'
  schedule:
    - cron: '0 22 * * *'

jobs:
  test:
    runs-on: ubuntu-latest

    container:
      image: ros:humble-ros-base

    env:
      PYTHONPATH: .

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install dependencies
      run: |
        apt-get update && apt-get install -y \
          python3-pip \
          python3-colcon-common-extensions \
          ros-humble-example-interfaces \
          ros-humble-mavros-msgs \
          ros-humble-action-tutorials-interfaces \
          curl \
          ca-certificates \
          gnupg
        curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
        apt-get install -y nodejs
        python3 -m pip install --upgrade pip
        pip install uv

    - name: Create and sync uv virtual environment
      run: |
        uv venv .venv
        uv pip install --upgrade pip
        uv sync --dev  # installs deps from uv.lock

    - name: Build ROS 2 Viewer UI
      run: |
        cd server/ui/ros2_viewer_app
        npm ci
        npm run build



    - name: Run tests
      run: |
        . /opt/ros/humble/setup.sh
        uv run pytest
