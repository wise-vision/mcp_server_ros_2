exclude: ^(server/|tests/|\.github/workflows/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=2000"]
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

# NOTE: server/*.py and tests/*.py are excluded repo-wide (see `exclude`
# above) because they are not yet whitespace/ruff-clean and reformatting
# them here would mix a large diff into this config-addition PR (issue #7).
# Follow-up PR: drop server/ and tests/ from the exclude, run
# `pre-commit run --all-files`, and land the resulting reformat on its own.
#
# .github/workflows/ is excluded so hook autofixes never rewrite CI
# definitions as a side effect of an unrelated commit; workflow changes
# should always be deliberate, reviewed edits.
